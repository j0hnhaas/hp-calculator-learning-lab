<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HP-45 · Decimal CORDIC</title>
  <meta name="description" content="Simulation of the HP-45 scientific calculator (1973) with authentic decimal CORDIC algorithms – step by step.">
  <meta name="theme-color" content="#1c1109">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="app.title">HP-45 · Decimal CORDIC</h1>
      <p data-i18n="app.subtitle"></p>
    </div>
    <div class="settings">
      <button type="button" class="pill" id="btn-lang">EN</button>
      <label class="pill toggle"><input type="checkbox" id="opt-timing" checked> <span data-i18n="settings.timing"></span></label>
      <label class="pill toggle"><input type="checkbox" id="opt-sound"> <span data-i18n="settings.sound"></span></label>
      <button type="button" class="pill" id="btn-install" hidden data-i18n="install"></button>
    </div>
  </header>

  <main class="stage">
    <section class="calc-wrap" id="calc-wrap">
      <div id="calc"></div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>
    <section class="lab" id="lab" aria-labelledby="lab-title"></section>
  </main>

  <button type="button" class="lab-fab" id="lab-toggle"><span data-i18n="lab.toggle">Inside</span> ▲</button>

  <noscript>This simulation needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
